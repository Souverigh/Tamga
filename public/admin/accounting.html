<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АДРЕ — бухгалтерия</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/css/styles.css">
<link rel="stylesheet" href="/admin/admin.css">
<link rel="stylesheet" href="/admin/accounting.css">
</head>
<body>
<div class="wrap admin-wrap acct-wrap">

  <header>
    <div class="brand"><span class="seal"><span>А</span></span>АДРЕ — бухгалтерия</div>
  </header>
  <p class="tagline">Внутренний review-экран для модуля бухгалтерии (Счет-фактура / ЭСФ, Товарная накладная, Акт выполненных работ, Платёжное поручение). Не публичная страница сайта.</p>

  <!-- Тот же секрет и сессия, что у /admin (public/admin/admin.js, SECRET_KEY='tamga_admin_secret') -->
  <section id="gate" class="panel">
    <div class="step-label">Вход</div>
    <input type="password" id="secretInput" class="admin-input" placeholder="Секрет админки" autocomplete="current-password">
    <button class="btn-primary" id="gateBtn" type="button" style="margin-top:12px;">Войти</button>
    <div id="gateError" class="admin-error" style="display:none;"></div>
  </section>

  <section id="acctMain" style="display:none;">

    <div class="panel">
      <div class="step-label" style="margin-bottom:12px;">Загрузить документы</div>
      <label class="btn-secondary acct-file-label" for="fileInput">Выбрать файлы</label>
      <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,application/pdf" class="acct-file-input" multiple>
      <div id="fileList" class="acct-file-list" style="display:none;"></div>
      <button class="btn-primary" id="recognizeBtn" type="button" style="margin-top:12px;" disabled>Распознать</button>
      <div id="acctError" class="admin-error" style="display:none;"></div>
      <div id="acctLoading" class="admin-note" style="display:none;"></div>
    </div>

    <section id="resultPanel" style="display:none;">
      <div class="acct-columns">

        <!-- Левая колонка: оригинал -->
        <div class="panel acct-col-original">
          <div class="step-label">Оригинал</div>
          <div id="previewBox"></div>
        </div>

        <!-- Правая колонка: поля + проверки -->
        <div class="panel acct-col-fields">
          <div class="acct-status-row">
            <div class="step-label" style="margin:0;" id="docTypeLabel">Документ</div>
            <span id="overallBadge" class="acct-badge"></span>
          </div>

          <button class="btn-secondary" id="exportBtn" type="button" style="margin-bottom:14px;" disabled>Скачать Excel</button>
          <div id="exportError" class="admin-error" style="display:none;"></div>

          <table class="admin-table acct-header-table" id="headerTable"></table>

          <div class="admin-section-title" id="itemsSectionTitle">Строки</div>
          <div class="acct-table-scroll" id="itemsSection">
            <table class="admin-table" id="itemsTable">
              <thead>
                <tr><th>Наименование</th><th>Кол-во</th><th>Цена</th><th>Сумма</th><th>Ставка НДС</th><th>Сумма НДС</th></tr>
              </thead>
              <tbody id="itemsBody"></tbody>
            </table>
          </div>

          <div class="admin-section-title">Проверки</div>
          <div id="rulesList" class="acct-rules-list"></div>
        </div>

      </div>
    </section>

  </section>

</div>
<script type="module" src="/admin/accounting.js"></script>
</body>
</html>
